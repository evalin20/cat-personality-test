function calc(){let u={s:0,i:0,n:0,c:0,r:0};A.forEach(a=>{let v=V[a];for(let k in u)u[k]+=v[k]});return u}function score(p,u){let t=[['s',p[2]],['i',p[3]],['n',p[4]],['c',p[5]],['r',p[6]]];let d=t.reduce((z,x)=>z+(u[x[0]]/Q.length*2-x[1])**2,0);return Math.max(0,Math.min(99,100-Math.sqrt(d/5)*18))}function result(){let u=calc(),R=P.map((p,i)=>({p,i,s:score(p,u)})).sort((a,b)=>b.s-a.s),t=R[0];document.getElementById('quiz').classList.add('hidden');document.getElementById('res').classList.remove('hidden');document.getElementById('top').textContent=t.p[0];document.getElementById('desc').textContent=t.p[1];document.getElementById('tags').innerHTML=tags(t.p);let D=[['社交力','獨立'],['獨立度','需要陪伴'],['敏感度','鈍感'],['好奇心','喜歡熟悉'],['情感濃度','淡定']];document.getElementById('axes').innerHTML=D.map((d,j)=>{let k=['s','i','n','c','r'][j],v=Math.max(5,Math.min(95,(u[k]/Q.length+2)/6*100));return `<div class="axis"><div class="axisTop"><span>${d[0]}</span><span>${d[1]}</span></div><div class="axisbar"><div class="axisfill" style="width:${v}%"></div></div></div>`}).join('');document.getElementById('ranking').innerHTML=R.slice(0,10).map((x,i)=>`<div class="rank"><div class="num">${i+1}</div><div><div class="rn">${x.p[0]}</div><div class="rd">${x.p[1]}</div></div><div class="score">${Math.round(x.s)}%</div></div>`).join('');let kw=[];kw.push(u.i>=u.s?'有自己的世界':'很吃陪伴');kw.push(u.n>=u.c?'細節感受派':'行動探索派');kw.push(u.r>Q.length?'深情':'慢熱');kw.push(u.c>Q.length?'好奇心強':'喜歡熟悉感');kw.push(u.s>Q.length?'社交能量高':'選擇性社交');document.getElementById('keywords').innerHTML=kw.map(x=>`<span class="tag">${x}</span>`).join('');scrollTo({top:0,behavior:'smooth'})}function tags(p){let z=[];if(p[3]>=4)z.push('獨立派');if(p[2]>=3)z.push('社交型');if(p[4]>=3)z.push('高敏感');if(p[5]>=3)z.push('探索派');if(p[6]>=3)z.push('深情派');return z.map(x=>`<span class="tag">${x}</span>`).join('')}async function share(){let s=`我測出來最像「${document.getElementById('top').textContent}」🐈\n你是哪一種貓？快來測！`;if(navigator.share){try{await navigator.share({title:'你是哪一種貓？',text:s})}catch(e){}}else{try{await navigator.clipboard.writeText(s);alert('結果已複製！')}catch(e){alert(s)}}}function again(){idx=0;A=Array(Q.length).fill('');document.getElementById('res').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');render();scrollTo(0,0)}
</script></body></html>
